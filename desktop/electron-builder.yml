appId: com.seraphim.app
productName: Seraphim
copyright: Copyright © Seraphim

# publish provider를 명시 (없으면 dmg 후 updateInfo 생성 중
#  "Cannot read properties of null (reading 'channel')" 크래시)
publish:
  provider: github
  owner: hyotowork-create
  repo: Seraphim
  releaseType: release

afterPack: scripts/adhoc-sign.cjs
afterSign: scripts/mac-verify.cjs

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json

# 네이티브 모듈(better-sqlite3 등)은 asar 밖으로 언팩 — M1에서 DB 도입 시 사용
asarUnpack:
  - "**/*.node"
  - "**/node_modules/better-sqlite3/**"

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Seraphim

portable:
  artifactName: Seraphim-${version}-portable.exe

# macOS 후순위
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.productivity
  # 서명: Developer ID 인증서(CSC_LINK)와 APPLE_ID·APPLE_APP_SPECIFIC_PASSWORD·APPLE_TEAM_ID가 있으면 정식 서명+공증(경고 없음).
  # 없으면 afterPack에서 앱 전체를 ad-hoc 서명. 링커 서명만 남은 앱은 Apple Silicon에서 「손상된 앱」으로 막힘(10/21 확인)
  hardenedRuntime: true
