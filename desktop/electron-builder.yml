appId: com.seraphim.app
productName: Seraphim
copyright: Copyright © Seraphim

# publish provider를 명시 (없으면 dmg 후 updateInfo 생성 중
#  "Cannot read properties of null (reading 'channel')" 크래시)
publish:
  provider: github
  owner: hyotowork-create
  repo: Seraphim
  releaseType: release

afterPack: scripts/adhoc-sign.cjs

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json

# 네이티브 모듈(better-sqlite3 등)은 asar 밖으로 언팩 — M1에서 DB 도입 시 사용
asarUnpack:
  - "**/*.node"
  - "**/node_modules/better-sqlite3/**"

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Seraphim

portable:
  artifactName: Seraphim-${version}-portable.exe

# macOS 후순위
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.productivity
  # 인증서가 없으므로 electron-builder 서명은 건너뛰고(identity: null), afterPack에서 앱 전체를 ad-hoc으로 다시 서명.
  # 링커 서명만 남은 앱은 서명이 깨진 것으로 보여 Apple Silicon에서 「손상되었기 때문에 열 수 없습니다」로 막힘(10/21 확인)
  identity: null
