<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>주보 관리자</title>
    <!-- 관리자 화면은 검색엔진에 노출하지 않습니다 -->
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!--
      Sveltia CMS 로더 (오프라인 지원).
      인터넷/CDN 없이도 동작하도록 CMS 스크립트를 저장소 안에 함께 넣어둡니다.
      vendor/sveltia-cms.js = @sveltia/cms 번들. 나중에 새 버전으로 갱신하려면:
        npm pack @sveltia/cms
        tar xzf sveltia-cms-*.tgz
        cp package/dist/sveltia-cms.js src/admin/vendor/sveltia-cms.js
      (대안: Decap CMS 번들을 같은 방식으로 넣고 아래 경로만 바꾸면 됩니다.)
    -->
    <script src="./vendor/sveltia-cms.js"></script>
  </body>
</html>
