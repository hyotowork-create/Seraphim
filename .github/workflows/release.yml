name: Release (Windows + macOS)

# v* 태그 푸시 또는 수동 실행 시: Windows(설치판+Portable) + macOS(dmg)를
# 빌드해 GitHub Releases에 업로드한다. (electron-builder --publish always)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      max-parallel: 1 # 같은 릴리스에 동시 업로드 충돌 방지 (순차)
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder_args: --win --x64
          - os: macos-14 # Apple Silicon 서버에서 arm64·x64(인텔) dmg를 함께 만듦(electron-builder.yml mac.arch). macos-13 서버는 GitHub에서 없어져 뺌
            builder_args: --mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Bundle
        run: npm run build

      - name: Build & publish to Releases
        run: npx electron-builder ${{ matrix.builder_args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
