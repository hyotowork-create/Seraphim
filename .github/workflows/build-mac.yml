name: Build test apps (macOS .dmg + Windows .exe)

# 수동 실행(Actions 탭 → Run workflow) 또는 v* 태그 푸시 시 빌드
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest # Apple Silicon
            arch: arm64
          - runner: macos-latest # 인텔(x64)도 Apple Silicon 서버에서 교차 빌드(macos-13 서버 없어짐)
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # 의존성 설치 (postinstall이 better-sqlite3를 Electron ABI로 리빌드)
      - name: Install deps
        run: npm ci

      # 렌더러/메인 번들
      - name: Bundle
        run: npm run build

      # YouTube 라이브 송출용 ffmpeg(git에 없음, vendor/ffmpeg/README.md)
      - name: Prepare ffmpeg
        run: |
          [ "${{ matrix.arch }}" = x64 ] && brew install nasm   # 인텔(x86_64) ffmpeg 어셈블러
          zsh scripts/build-ffmpeg-mac.sh ${{ matrix.arch }}

      # .dmg 빌드 (Secrets가 있으면 정식 서명·공증, 없으면 ad-hoc — electron-builder.yml mac 참고)
      - name: Build dmg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ] && [ -n "$MAC_CERT_P12_BASE64" ]; then
            # 맥 정식 서명·공증(저장소 Secrets가 있을 때만, 없으면 ad-hoc). 빈 값을 넘기면 electron-builder가 실패하므로 있을 때만 내보냄
            export CSC_LINK="$MAC_CERT_P12_BASE64" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            [ -n "$MAC_APPLE_TEAM_ID" ] && export APPLE_ID="$MAC_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$MAC_APPLE_APP_SPECIFIC_PASSWORD" APPLE_TEAM_ID="$MAC_APPLE_TEAM_ID"
          fi
          npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: Seraphim-mac-${{ matrix.arch }}
          path: desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 30

  # Windows 시험 빌드(릴리스에 올리지 않음). 릴리스 전 설치 파일·ffmpeg 포함 여부 확인용
  build-win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node scripts/fetch-ffmpeg.mjs win32-x64
      - run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Seraphim-win-x64
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30
